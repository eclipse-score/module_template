description: "Type /sdlc or KICKOFF to start Eclipse S-CORE onboarding."
entry_point: "tools.onboarding.cli:cli"
skill: "onboarding.skill.md"

collects:
  - role
  - repository
  - technology
  - contribution_type
  - workflow

produces:
  - .onboarding/context.json

notes: >
  This agent hands off to downstream agents only on explicit contributor confirmation; it never executes them automatically.
